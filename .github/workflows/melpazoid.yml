name: melpazoid

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject top-level key bindings
        run: |
          if rg -n '^\((keymap-set|define-key)\s' --glob 'org-timegrid*.el' .; then
            echo 'Initialize bindings inside the keymap defvar to preserve user customizations.'
            exit 1
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install melpazoid
        run: |
          sudo apt-get update
          sudo apt-get install --yes emacs
          git clone --depth 1 https://github.com/riscy/melpazoid.git "$RUNNER_TEMP/melpazoid"
      - name: Lint package
        env:
          LOCAL_REPO: ${{ github.workspace }}
          RECIPE: '(org-timegrid :fetcher github :repo "Gleek/org-timegrid")'
          WARN_IS_ERROR: 'false'
        run: make -C "$RUNNER_TEMP/melpazoid"
